name: Hush Room candidate check
on:
  push:
    branches: [sae/D6-colour-hush]
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official test tooling
        run: |
          npm install --prefix /tmp/hush-qa playwright@1.56.1
          if [ '${{ matrix.browser }}' = webkit ]; then /tmp/hush-qa/node_modules/.bin/playwright install --with-deps webkit; else google-chrome --version; fi
      - name: Test colour model
        run: node --test hush-room/model.test.cjs
      - name: Check candidate and existing pages
        run: |
          python3 -m http.server 8096 --bind 127.0.0.1 >/tmp/hush-http.log 2>&1 &
          sleep 1
          NODE_PATH=/tmp/hush-qa/node_modules BROWSER=${{ matrix.browser }} node tools/check-hush-room.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hush-room-${{ matrix.browser }}
          path: hush-room-qa/
          retention-days: 7
