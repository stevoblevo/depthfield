<!doctype html>
<html><head><meta charset="utf-8"><title>SceneCaption</title>
<style>body{margin:0;background:var(--void);color:var(--ink);font-family:var(--font-sans);}.scene{position:relative;height:300px;overflow:hidden;background:var(--surface)}.scene svg{position:absolute;inset:0;width:100%;height:100%}.a{fill:var(--accent)}.b{fill:var(--surface-raised)}.c{fill:var(--line)}.df-caption{position:absolute;left:32px;bottom:32px}</style></head>
<body>
<div class="scene"><svg viewBox="0 0 800 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<circle class="c" cx="560" cy="150" r="240"/><circle class="b" cx="560" cy="150" r="170"/><circle class="a" cx="560" cy="150" r="90"/></svg>
<aside class="df-caption"><p class="df-caption__label">Drag to orbit</p><h3 class="df-caption__title">Kelp canopy, 40 m</h3>
<p class="df-caption__body">Pressure here is two hundred times the surface. Light stopped a kilometre ago.</p></aside></div>
<script></script></body></html>
