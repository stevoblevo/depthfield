<!doctype html>
<html><head><meta charset="utf-8"><title>Hotspot</title>
<style>body{margin:0;background:var(--void);color:var(--ink);font-family:var(--font-sans);}.art{position:relative;height:320px;overflow:hidden;background:linear-gradient(180deg,var(--gh-sky-top) 0%,var(--gh-sky-low) 62%,var(--gh-ridge-2) 62.2%,var(--gh-ridge-3) 80%,var(--art-void) 100%);}.spore{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--mint);box-shadow:0 0 30px 10px rgba(94,242,184,.35)}.spore.found{background:var(--frost);box-shadow:0 0 30px 10px rgba(201,230,255,.3)}.cap{position:absolute;left:32px;top:24px;max-width:300px}.chip{position:absolute;right:24px;bottom:20px}</style></head>
<body>
<div class="art"><i class="spore" style="left:22%;top:66%"></i><i class="spore" style="left:56%;top:36%"></i><i class="spore found" style="left:78%;top:60%"></i>
<button class="df-hotspot df-hotspot--visible" style="left:22%;top:66%" aria-label="Frost seed: particles orbit it while your cursor is close"></button>
<button class="df-hotspot df-hotspot--visible" style="left:56%;top:36%" aria-label="Glass bloom: hidden high in the haze"></button>
<button class="df-hotspot df-hotspot--visible is-found" style="left:78%;top:60%" aria-label="Mint spore: found"></button>
<aside class="df-caption cap"><p class="df-caption__label">Hold to open</p><h3 class="df-caption__title">Mint spore</h3><p class="df-caption__body">A hotspot drawn into the art. Hover makes it bloom; press fires a ripple and counts it.</p></aside>
<span class="df-hudchip chip">spores <b>1</b> / 3</span></div>
<script></script></body></html>
