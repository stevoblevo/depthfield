<!doctype html>
<html><head><meta charset="utf-8"><title>ScrollProgress</title>
<style>body{margin:0;background:var(--void);color:var(--ink);font-family:var(--font-sans);}.wrap{padding:28px 32px;display:flex;gap:24px;flex-wrap:wrap}</style></head>
<body>
<div class="wrap">
<div class="df-progress" data-df-progress role="progressbar" aria-label="Story progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="42">

</span><span>Signal</span></nav></div>
<script></script></body></html>
