<!doctype html>
<html><head><meta charset="utf-8"><title>Dialog</title>
<style>body{margin:0;background:var(--void);color:var(--ink);font-family:var(--font-sans);}.host{display:grid;place-items:center;height:280px;background:color-mix(in srgb,var(--void) 60%,var(--surface))}</style></head>
<body>
<div class="host"><div class="df-dialog df-dialog--static" role="dialog" aria-labelledby="dlg"><h2 id="dlg">Use the motion sensors?</h2>
<p>Tilt rolls the voices and leans the sky. Nothing leaves this page, and you can switch it off from the bubble.</p>
<div class="df-dialog__actions"><button class="df-btn df-btn--ghost" data-df-close>Not now</button><button class="df-btn df-btn--primary" data-df-close>Allow motion</button></div></div></div>
<script></script></body></html>
