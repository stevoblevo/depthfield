<!doctype html>
<html><head><meta charset="utf-8"><title>Secret</title>
<style>body{margin:0;background:var(--void);color:var(--ink);font-family:var(--font-sans);}.row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding:28px 24px 0}.cell{display:grid;gap:12px;align-content:start}.cell .df-eyebrow{margin:0}.status{margin:20px 24px 0;font:400 13px/18px var(--font-mono);color:var(--cue);min-height:18px}</style></head>
<body>
<div class="row">
<div class="cell"><p class="df-eyebrow">0 · hidden</p><span style="font:400 12px/34px var(--font-mono);color:var(--ink-muted)">nothing yet</span></div>
<div class="cell"><p class="df-eyebrow">1 · glyph</p><span><button class="df-secret is-shown is-pulsing" type="button" aria-label="Conway's Life"><span class="df-secret__glyph"></span><span class="df-secret__name">Life</span></button></span></div>
<div class="cell"><p class="df-eyebrow">2 · named</p><span><button class="df-secret is-shown is-named" type="button" aria-label="Conway's Life"><span class="df-secret__glyph"></span><span class="df-secret__name">Life</span></button></span></div>
<div class="cell"><p class="df-eyebrow">Live · 1.5s, 3s</p><span><button class="df-secret" id="live" type="button" aria-pressed="false" aria-label="Conway's Life" hidden><span class="df-secret__glyph"></span><span class="df-secret__name">Life</span></button></span></div>
</div>
<p class="status" id="st" aria-live="polite"></p>
<script>(function(){function go(){if(!window.Depthfield)return;run();}function run(){var b=document.getElementById('live'),st=document.getElementById('st');Depthfield.secret({id:'preview',chip:b,after:1500,nameAfter:1500,hint:function(){st.textContent='Something here is alive. Try the diamond.';},onOpen:function(){b.setAttribute('aria-pressed','true');st.textContent='Opened. Next visit it starts named.';}});}if(document.readyState!=='loading')go();else document.addEventListener('DOMContentLoaded',go);})();</script>
</body></html>
